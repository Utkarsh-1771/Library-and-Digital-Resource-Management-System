<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css">
</head>

<body>
  <header class="nav-bar">
    <div class="nav-content">
      <p class="nav-text">Library and Digital Resource Management System</p>
    </div>
  </header>

  <div class="page">
    <h1>Contact Us</h1>
    <p class="subtitle">Got a question? Send us a message and we'll get back to you.</p>

    <div class="card">
      <form>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@example.com">
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Write your message here"></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </div>

    <div class="details">
      <p>Central Library, Main Campus, Mathura</p>
      <p>library@example.com</p>
      <p>Open Monday to Saturday, 9 AM to 5 PM</p>
    </div>
    <a href="home.html" class="back-link">Back to Home</a>
  </div>
  </div>
</body>

</html>
