<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="project.css">
</head>

<body>
    <header class="nav-bar">
        <div class="nav-content">
            <p class="nav-text">Library and Digital Resource Management System</p>
        </div>
    </header>
    <main>
        <div class="box add-book">

            <h2>Add New Book</h2>
            <p>Enter the details of the new book</p>

            <div class="form">

                <div>
                    <label for="book-name">Book Name</label>
                    <input type="text" id="book-name" placeholder="Enter book name">
                </div>

                <div>
                    <label for="book-author">Author</label>
                    <input type="text" id="book-author" placeholder="Enter author name">
                </div>

                <div>
                    <label for="book-category">Category</label>
                    <select id="book-category">
                        <option>Fiction</option>
                        <option>Science</option>
                        <option>History</option>
                        <option>Non-Fiction</option>
                    </select>
                </div>

                <div>
                    <label for="book-quantity">Quantity</label>
                    <input type="number" id="book-quantity" placeholder="Enter quantity">
                </div>

                <div class="full">
                    <label for="book-description">Description</label>
                    <textarea id="book-description" placeholder="Write a short description of the book"></textarea>
                </div>

            </div>

            <button id="add-book-btn">Add Book</button>
            <p id="add-message"></p>

        </div>
        <div class="bottom-section">
            <div class="box">

                <h2>Issue Book</h2>
                <p>Enter student and book details</p>

                <div class="form">

                    <div>
                        <label for="issue-student-name">Student Name</label>
                        <input type="text" id="issue-student-name" placeholder="Enter student name">
                    </div>

                    <div>
                        <label for="issue-student-id">Student ID</label>
                        <input type="text" id="issue-student-id" placeholder="Enter student ID">
                    </div>

                    <div>
                        <label for="issue-book-name">Book Name</label>
                        <input type="text" id="issue-book-name" placeholder="Enter book name">
                    </div>

                    <div>
                        <label for="issue-date">Issue Date</label>
                        <input type="date" id="issue-date">
                    </div>

                </div>

                <button id="issue-btn">Issue Book</button>
                <p id="issue-message"></p>

            </div>
            <div class="box">

                <h2>Return Book</h2>
                <p>Enter book return details</p>

                <div class="form">

                    <div>
                        <label for="return-student-id">Student ID</label>
                        <input type="text" id="return-student-id" placeholder="Enter student ID">
                    </div>

                    <div>
                        <label for="return-book-name">Book Name</label>
                        <input type="text" id="return-book-name" placeholder="Enter book name">
                    </div>

                    <div>
                        <label for="return-date">Return Date</label>
                        <input type="date" id="return-date">
                    </div>

                    <div>
                        <label for="return-fine">Fine</label>
                        <input type="number" id="return-fine" placeholder="Enter fine amount">
                    </div>

                </div>

                <button id="return-btn">Return Book</button>
                <p id="return-message"></p>

            </div>
        </div>
    </main>

    <script src="project.js"></script>
</body>

</html>
