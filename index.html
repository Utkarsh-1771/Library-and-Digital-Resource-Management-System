<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library and Digital Resource Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- Left side -->
        <div class="intro">

            <h1>
                Library and Digital Resource Management System
            </h1>

            <p>
                Browse the catalogue, add new books and keep track of what is
                issued and returned, all from one simple page.
            </p>

        </div>


        <!-- Right side -->
        <div class="form-side">

            <div class="card">

                <h2>Log in</h2>

                <p class="sub">
                    Enter your details to open the library catalogue.
                </p>


                <form>

                    <div class="field">

                        <label for="role">I am a</label>

                        <select id="role">

                            <option>Member</option>
                            <option>Librarian</option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="name@example.com"
                        >

                    </div>


                    <div class="field">

                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                        >

                    </div>


                    <div class="options">

                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot password?</a>

                    </div>


                    <button type="submit">
                        Log in
                    </button>

                </form>


                <p class="footer-text">
                    New here?
                    <a href="#">Create an account</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
